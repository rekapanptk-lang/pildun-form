<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tebak Skor Piala Dunia FIFA 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #1a0000;
    }

    /* ── CARD dengan background image + overlay ── */
    .card {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    }

    /* Background image layer */
    .card-bg {
      position: absolute;
      inset: 0;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    /* Gradient overlay merah */
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(200, 0, 0, 0.82) 0%,
        rgba(140, 0, 0, 0.88) 40%,
        rgba(80, 0, 0, 0.93) 100%
      );
      z-index: 1;
    }

    /* Konten di atas overlay */
    .card-content {
      position: relative;
      z-index: 2;
      padding: 32px 28px 28px;
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    .card-content::-webkit-scrollbar { width: 4px; }
    .card-content::-webkit-scrollbar-track { background: transparent; }
    .card-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    /* ── HEADER ── */
    .head { text-align: center; margin-bottom: 24px; }
    .head .logo { font-size: 52px; margin-bottom: 6px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4)); }
    .head h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      color: #fff;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.2;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .head p {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* ── STEP INFO ── */
    .info {
      background: rgba(255,255,255,0.12);
      border-left: 3px solid rgba(255,255,255,0.5);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .step { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; color: rgba(255,255,255,0.85); }
    .step:last-child { margin-bottom: 0; }
    .step .num {
      background: rgba(255,255,255,0.25);
      color: white;
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; flex-shrink: 0;
    }

    /* ── GOOGLE BTN ── */
    .google-btn {
      width: 100%; padding: 13px;
      background: white; color: #333;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .google-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

    /* ── USER BAR ── */
    .user-bar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px; padding: 10px 14px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 16px; flex-shrink: 0;
    }
    .user-name  { font-weight: 700; font-size: 14px; color: white; }
    .user-email { font-size: 12px; color: rgba(255,255,255,0.7); }
    .change-btn {
      margin-left: auto; padding: 4px 10px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px; background: transparent;
      font-size: 12px; cursor: pointer; color: rgba(255,255,255,0.8);
      transition: background 0.15s;
    }
    .change-btn:hover { background: rgba(255,255,255,0.15); }

    /* ── LABELS & INPUTS ── */
    label {
      display: block; font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.8); margin-bottom: 5px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    input[type=text], input[type=tel], input[type=number] {
      width: 100%; padding: 11px 14px;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 10px; font-size: 14px; font-weight: 500;
      color: white; outline: none;
      transition: border 0.2s, background 0.2s;
      font-family: inherit; margin-bottom: 16px;
    }
    input[type=text]::placeholder,
    input[type=tel]::placeholder  { color: rgba(255,255,255,0.4); }
    input[type=text]:focus,
    input[type=tel]:focus         { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.2); }
    input[type=number] { text-align: center; font-size: 24px; font-weight: 700; padding: 10px; margin-bottom: 0; }
    input[type=number]:focus { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.2); }
    .error-msg { color: #ffb3b3; font-size: 11px; margin-top: -12px; margin-bottom: 12px; }

    /* ── MATCH CARDS ── */
    .matches-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

    .match-card {
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 12px; overflow: hidden;
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
    }
    .match-card.selected {
      border-color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.18);
    }

    .match-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
    }
    .match-checkbox {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 4px; background: transparent;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .match-card.selected .match-checkbox {
      background: white;
      border-color: white;
    }
    .match-checkbox-tick {
      color: #c00; font-size: 12px; font-weight: 900;
      display: none;
    }
    .match-card.selected .match-checkbox-tick { display: block; }

    .match-title {
      font-weight: 700; font-size: 13px; color: white;
      flex: 1;
    }
    .match-time {
      font-size: 11px; color: rgba(255,255,255,0.6);
    }

    /* Score input row */
    .score-section {
      display: none;
      padding: 0 14px 14px;
    }
    .match-card.selected .score-section { display: block; }

    .score-row {
      display: flex; align-items: center; gap: 10px;
    }
    .score-col { flex: 1; text-align: center; }
    .team-label {
      font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.8);
      margin-bottom: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .vs-badge {
      background: rgba(255,255,255,0.2);
      color: white; font-weight: 800; font-size: 13px;
      padding: 6px 10px; border-radius: 8px;
      flex-shrink: 0; align-self: center; margin-top: 18px;
    }

    /* ── SUBMIT BTN ── */
    .btn {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #ff4444 0%, #cc0000 60%, #990000 100%);
      color: white; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(200,0,0,0.5);
      letter-spacing: 0.3px;
    }
    .btn:hover  { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(200,0,0,0.6); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── DIVIDER ── */
    .divider {
      border: none; border-top: 1px solid rgba(255,255,255,0.15);
      margin: 18px 0;
    }

    #loginSection { display: block; }
    #formSection  { display: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="card-bg"></div>
  <div class="card-overlay"></div>
  <div class="card-content">

    <!-- HEADER -->
    <div class="head">
      <div class="logo">🏆</div>
      <h1 id="pageTitle">TEBAK SKOR PIALA DUNIA FIFA 2026</h1>
      <p id="pageSubtitle">Ikuti event tebak skor untuk beberapa pertandingan pilihan di Piala Dunia 2026</p>
    </div>

    <!-- LOGIN SECTION -->
    <div id="loginSection">
      <div class="info">
        <div class="step"><span class="num">1</span> Login dengan akun Google kamu</div>
        <div class="step"><span class="num">2</span> Isi tebakan skor pertandingan</div>
        <div class="step"><span class="num">3</span> Izinkan notifikasi ke Google Calendar</div>
      </div>
      <button class="google-btn" onclick="loginGoogle()">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Lanjutkan dengan Google
      </button>
    </div>

    <!-- FORM SECTION -->
    <div id="formSection">

      <!-- User bar -->
      <div class="user-bar">
        <div class="avatar" id="userAvatar">?</div>
        <div>
          <div class="user-name"  id="userName">-</div>
          <div class="user-email" id="userEmail">-</div>
        </div>
        <button class="change-btn" onclick="logout()">Ganti Akun</button>
      </div>

      <!-- User ID -->
      <label>User ID *</label>
      <input type="text" id="userId" placeholder="Minimal 4 karakter (huruf/angka)" maxlength="30">
      <div class="error-msg" id="errUserId"></div>

      <!-- WhatsApp -->
      <label>Nomor WhatsApp *</label>
      <input type="tel" id="noHp" placeholder="08xxxxxxxxxx (min 10 digit)">
      <div class="error-msg" id="errWa"></div>

      <hr class="divider">

      <!-- Match list -->
      <label style="margin-bottom:10px">Pilih Pertandingan & Isi Tebakan</label>
      <div class="matches-list" id="matchesList">
        <div style="color:rgba(255,255,255,0.5);font-size:13px;text-align:center;padding:16px">
          ⏳ Memuat pertandingan...
        </div>
      </div>
      <div class="error-msg" id="errMatch"></div>

      <button class="btn" id="submitBtn" onclick="handleSubmit()">
        📅 Submit & Hubungkan Calendar
      </button>
    </div>

  </div><!-- /card-content -->
</div><!-- /card -->

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1G85WVH53xRcoPsKNMlniRQXObUlvF47kegtaQlUptTnkclMngnWtRTApvVx4WwQ3/exec';
  const CLIENT_ID       = '69593145654-5c2n90v8f3cetmtjl91u7ua00rg7rub2.apps.googleusercontent.com';
  const BASE_URL        = 'https://lovely-centaur-28e19a.netlify.app';

  let matches     = [];
  let currentUser = null;

  // ── Load config dari Apps Script ──
  async function loadConfig() {
    try {
      const r = await fetch(APPS_SCRIPT_URL + '?action=getConfig');
      const d = await r.json();
      matches = d.data || [];

      // Load setting title/subtitle jika ada
      if (d.title)    document.getElementById('pageTitle').textContent    = d.title;
      if (d.subtitle) document.getElementById('pageSubtitle').textContent = d.subtitle;
    } catch(e) {
      matches = [];
    }
    renderMatches();
  }

  function renderMatches() {
    const list = document.getElementById('matchesList');
    if (!matches.length) {
      list.innerHTML = '<div style="color:rgba(255,255,255,0.5);font-size:13px;text-align:center;padding:16px">Belum ada pertandingan tersedia</div>';
      return;
    }
    list.innerHTML = matches.map((m, i) => `
      <div class="match-card" id="match-${i}" onclick="toggleMatch(${i})">
        <div class="match-header">
          <div class="match-checkbox">
            <span class="match-checkbox-tick">✓</span>
          </div>
          <div class="match-title">${m.pertandingan}</div>
          <div class="match-time">${m.jam || ''}</div>
        </div>
        <div class="score-section">
          <div class="score-row">
            <div class="score-col">
              <div class="team-label">${m.timA}</div>
              <input type="number" id="scoreA-${i}" min="0" max="20" value="0" onclick="event.stopPropagation()">
            </div>
            <div class="vs-badge">VS</div>
            <div class="score-col">
              <div class="team-label">${m.timB}</div>
              <input type="number" id="scoreB-${i}" min="0" max="20" value="0" onclick="event.stopPropagation()">
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function toggleMatch(i) {
    const card = document.getElementById('match-' + i);
    card.classList.toggle('selected');
    document.getElementById('errMatch').textContent = '';
  }

  // ── Validasi ──
  function validateUserId(val) {
    if (!val || val.length < 4) return 'User ID minimal 4 karakter';
    if (!/^[a-zA-Z0-9]+$/.test(val)) return 'User ID hanya boleh huruf dan angka';
    return '';
  }

  function validateWa(val) {
    if (!val) return 'Nomor WhatsApp wajib diisi';
    if (!/^\d+$/.test(val)) return 'Nomor WhatsApp hanya boleh angka';
    if (val.length < 10) return 'Nomor WhatsApp minimal 10 digit';
    return '';
  }

  // ── Submit ──
  function handleSubmit() {
    const userId = document.getElementById('userId').value.trim();
    const noHp   = document.getElementById('noHp').value.trim();

    // Validasi
    const errUID = validateUserId(userId);
    const errWA  = validateWa(noHp);
    document.getElementById('errUserId').textContent = errUID;
    document.getElementById('errWa').textContent     = errWA;
    if (errUID || errWA) return;

    // Cek minimal 1 match dipilih
    const selected = matches.map((m, i) => {
      const card = document.getElementById('match-' + i);
      if (!card || !card.classList.contains('selected')) return null;
      return {
        pertandingan: m.pertandingan,
        timA: m.timA,
        timB: m.timB,
        skorA: document.getElementById('scoreA-' + i)?.value || '0',
        skorB: document.getElementById('scoreB-' + i)?.value || '0'
      };
    }).filter(Boolean);

    if (!selected.length) {
      document.getElementById('errMatch').textContent = 'Pilih minimal 1 pertandingan';
      return;
    }

    document.getElementById('submitBtn').disabled    = true;
    document.getElementById('submitBtn').textContent = '⏳ Memproses...';

    // Simpan ke sessionStorage
    sessionStorage.setItem('pildun_matches', JSON.stringify(selected));
    sessionStorage.setItem('pildun_extra',   JSON.stringify({ userId, noHp }));

    // Encode state untuk calendar OAuth
    // Format: calendar|email|nama|userId|noHp|JSON_matches
    const state = encodeURIComponent([
      'calendar',
      currentUser.email,
      currentUser.name,
      userId,
      noHp,
      encodeURIComponent(JSON.stringify(selected))
    ].join('|'));

    const calendarOAuthUrl = 'https://accounts.google.com/o/oauth2/v2/auth'
      + '?client_id='    + encodeURIComponent(CLIENT_ID)
      + '&redirect_uri=' + encodeURIComponent(BASE_URL + '/.netlify/functions/callback')
      + '&response_type=code'
      + '&scope='        + encodeURIComponent('https://www.googleapis.com/auth/calendar')
      + '&access_type=offline'
      + '&prompt=consent'
      + '&state='        + state;

    window.location.href = calendarOAuthUrl;
  }

  // ── Google Login ──
  function loginGoogle() {
    window.location.href = '/.netlify/functions/auth?state=login';
  }

  function logout() {
    sessionStorage.removeItem('pildun_user');
    currentUser = null;
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('formSection').style.display  = 'none';
  }

  function showForm(email, name) {
    currentUser = { email, name };
    sessionStorage.setItem('pildun_user', JSON.stringify(currentUser));
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('formSection').style.display  = 'block';
    document.getElementById('userName').textContent   = name;
    document.getElementById('userEmail').textContent  = email;
    document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
  }

  // ── Init ──
  window.onload = function() {
    loadConfig();

    const params = new URLSearchParams(window.location.search);
    const email  = params.get('email');
    const name   = params.get('name');
    const step   = params.get('step');

    if (email && step === 'form') {
      showForm(email, name || email);
      window.history.replaceState({}, '', '/');
      return;
    }

    const saved = sessionStorage.getItem('pildun_user');
    if (saved) {
      const u = JSON.parse(saved);
      showForm(u.email, u.name);
    }
  };
</script>
</body>
</html>
