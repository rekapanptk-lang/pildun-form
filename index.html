<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sumbutogel - Tebak Skor Gacor</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --dark-red: #1a0000; --accent-yellow: #ffdc00; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', Arial, sans-serif; min-height: 100vh; background: var(--dark-red); margin: 0; padding: 0; overflow-x: hidden; }

    .card { position: relative; width: 100%; max-width: 600px; height: 100vh; display: flex; flex-direction: column; margin: 0 auto; overflow: hidden; }
    .card-bg { position: absolute; inset: 0; background: url('bg.jpg') center top/cover no-repeat; z-index: 0; }
    .card-overlay { position: absolute; inset: 0; background: rgba(150, 0, 0, 0.4); z-index: 1; transition: 0.5s; }
    .card.login-active .card-overlay { opacity: 0; }
    .card-content { position: relative; z-index: 2; padding: 32px 28px; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }

    .logo-img { width: 260px; height: auto; display: block; margin: 0 auto 30px; }
    
    .google-btn {
      width: 100%; padding: 15px; background: white; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-top: auto;
    }
    
    input { width: 100%; padding: 12px 16px; background: #800000; border: 3px solid #ffffff; border-radius: 12px; color: white; margin-bottom: 15px; }
    .btn { width: 100%; padding: 15px; background: var(--primary-red, #cc0000); color: white; border: 3px solid #ffffff; border-radius: 12px; font-weight: 700; cursor: pointer; }
    
    .match-card { background: #800000; border: 3px solid #ffffff; border-radius: 14px; margin-bottom: 10px; color: white; padding: 15px; cursor: pointer; }
    .match-card.done { border-color: var(--accent-yellow); }
    .error-msg { color: #ffb3b3; font-size: 11px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="card login-active">
  <div class="card-bg"></div>
  <div class="card-overlay"></div>
  <div class="card-content">
    
    <div id="loginSection" style="display:flex; flex-direction:column; height:100%;">
      <a href="https://sumbu.link"><img src="https://dash.takenupload.org/GIf-SMBT-NEW-340" class="logo-img"></a>
      <button class="google-btn" onclick="loginGoogle()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20">
        Lanjutkan dengan Google
      </button>
    </div>

    <div id="formSection" style="display:none;">
      <a href="https://sumbu.link"><img src="https://dash.takenupload.org/GIf-SMBT-NEW-340" class="logo-img"></a>
      <label>USER ID *</label>
      <input type="text" id="userId" placeholder="Minimal 4 karakter">
      <label>NOMOR WHATSAPP *</label>
      <input type="tel" id="noHp" placeholder="08xxxxxxxxxx">
      <div id="matchesList"></div>
      <button class="btn" onclick="submitData()">SUBMIT</button>
    </div>
  </div>
</div>

<script>
  // PASTIIN LINK INI BENAR SESUAI PUNYA LO BRAY
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1G85WVH53xRcoPsKNMlniRQXObUlvF47kegtaQlUptTnkclMngnWtRTApvVx4WwQ3/exec';
  const CLIENT_ID = '69593145654-5c2n90v8f3cetmtjl91u7ua00rg7rub2.apps.googleusercontent.com';
  const BASE_URL = 'https://pildun-form.vercel.app';

  function loginGoogle() {
    window.location.href = '/api/auth?state=login';
  }

  // Logika form & submit balikin ke fungsi asli lo
  async function submitData() {
    // Pastikan logika validasi & fetch ke APPS_SCRIPT_URL ada di sini
    alert("Submit diproses..."); 
  }

  window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    if(params.get('step') === 'form') {
      document.querySelector('.card').classList.remove('login-active');
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('formSection').style.display = 'block';
    }
  }
</script>
</body>
</html>
