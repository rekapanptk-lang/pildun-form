<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tebak Skor Piala Dunia FIFA 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #1a0000;
    }

    /* ── CARD ── */
    .card {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    }

    .card-bg {
      position: absolute; inset: 0;
      background-image: url('bg.jpg'); /* Ganti dengan URL gambar background yang benar */
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(200,0,0,0.70) 0%, rgba(140,0,0,0.70) 40%, rgba(80,0,0,0.80) 100%);
      z-index: 1;
    }

    .card-content {
      position: relative; z-index: 2;
      padding: 32px 28px 28px;
      height: 620px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
      /* Untuk menengahkan konten secara vertikal, kita akan gunakan flexbox di card-content */
      display: flex;
      flex-direction: column;
    }
    .card-content::-webkit-scrollbar { width: 4px; }
    .card-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    /* ── GOOGLE BTN (Sederhana dan Sentral) ── */
    .google-btn {
      width: 100%; padding: 13px;
      background: white; color: #333;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      /* margin-top dihapus agar bisa ter-center otomatis oleh flexbox */
    }
    .google-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

    /* ── USER BAR ── */
    .user-bar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; padding: 10px 14px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 15px; flex-shrink: 0;
    }
    .user-name  { font-weight: 700; font-size: 13px; color: white; }
    .user-email { font-size: 11px; color: rgba(255,255,255,0.7); }
    .change-btn {
      margin-left: auto; padding: 4px 10px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px; background: transparent;
      font-size: 11px; cursor: pointer; color: rgba(255,255,255,0.8);
    }

    /* ── INPUTS ── */
    label {
      display: block; font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.8); margin-bottom: 5px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    input[type=text], input[type=tel] {
      width: 100%; padding: 11px 14px;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 10px; font-size: 14px; font-weight: 500;
      color: white; outline: none;
      transition: border 0.2s, background 0.2s;
      font-family: inherit; margin-bottom: 14px;
    }
    input[type=text]::placeholder,
    input[type=tel]::placeholder { color: rgba(255,255,255,0.4); }
    input[type=text]:focus,
    input[type=tel]:focus { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.2); }
    input[type=number] {
      width: 100%; padding: 10px;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      text-align: center; font-size: 24px; font-weight: 700;
      color: white; outline: none; font-family: inherit;
      transition: border 0.2s;
    }
    input[type=number]:focus { border-color: rgba(255,255,255,0.7); }
    .error-msg { color: #ffb3b3; font-size: 11px; margin-top: -10px; margin-bottom: 12px; }

    /* ── MATCH CARDS (ACCORDION) ── */
    .matches-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

    .match-card {
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 12px; overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .match-card.active {
      border-color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.16);
    }
    .match-card.done {
      border-color: rgba(255,220,0,0.5);
      background: rgba(255,200,0,0.08);
    }

    .match-header {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px;
      user-select: none;
    }
    .match-checkbox {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 4px; background: transparent;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .match-card.active .match-checkbox,
    .match-card.done  .match-checkbox { background: white; border-color: white; }
    .match-checkbox-tick { color: #c00; font-size: 11px; font-weight: 900; display: none; }
    .match-card.active .match-checkbox-tick,
    .match-card.done  .match-checkbox-tick { display: block; }

    .match-title { font-weight: 700; font-size: 13px; color: white; flex: 1; }
    .match-time  { font-size: 10px; color: rgba(255,255,255,0.55); white-space: nowrap; }

    /* Preview skor (saat card done tapi tidak active) */
    .match-preview {
      display: none;
      padding: 4px 14px 10px;
      font-size: 12px; color: rgba(255,220,0,0.9);
      font-weight: 600;
    }
    .match-card.done:not(.active) .match-preview { display: block; }

    /* Score input section */
    .score-section {
      display: none;
      padding: 4px 14px 14px;
    }
    .match-card.active .score-section { display: block; }

    .score-row { display: flex; align-items: center; gap: 10px; }
    .score-col { flex: 1; text-align: center; }
    .team-label {
      font-size: 10px; font-weight: 700;
      color: rgba(255,255,255,0.75);
      margin-bottom: 5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .vs-badge {
      background: rgba(255,255,255,0.2);
      color: white; font-weight: 800; font-size: 12px;
      padding: 5px 8px; border-radius: 8px;
      flex-shrink: 0; align-self: center; margin-top: 18px;
    }
    .btn-confirm {
      width: 100%; padding: 9px;
      background: rgba(255,255,255,0.2);
      color: white; border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; margin-top: 10px;
      transition: background 0.15s;
    }
    .btn-confirm:hover { background: rgba(255,255,255,0.3); }

    /* ── SUBMIT BTN ── */
    .btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #ff4444 0%, #cc0000 60%, #990000 100%);
      color: white; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 20px rgba(200,0,0,0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover   { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(200,0,0,0.6); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.15); margin: 14px 0; }

    /* ── SECTIONS ── */
    /* Splash section disembunyikan secara default */
    #splashSection { display: none; }
    
    /* Login section akan ditampilkan dan diposisikan secara vertikal-center */
    #loginSection {
      display: none; /* JS akan mengubahnya menjadi flex */
      height: 100%;
      width: 100%;
      flex: 1; /* Membuat container ini mengisi seluruh ruang kosong secara vertikal */
      flex-direction: column;
      justify-content: center; /* Center secara vertikal */
      align-items: center; /* Center secara horizontal */
    }
    #formSection  { display: none; }

    /* ── FADE TRANSITION ── */
    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="card">
  <div class="card-bg"></div>
  <div class="card-overlay"></div>
  <div class="card-content">

    <div id="loginSection">
      <button class="google-btn" onclick="loginGoogle()">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Lanjutkan dengan Google
      </button>
    </div>

    <div id="formSection">
      <div class="user-bar">
        <div class="avatar" id="userAvatar">?</div>
        <div>
          <div class="user-name"  id="userName">-</div>
          <div class="user-email" id="userEmail">-</div>
        </div>
        <button class="change-btn" onclick="logout()">Ganti Akun</button>
      </div>

      <label>User ID *</label>
      <input type="text" id="userId" placeholder="Minimal 4 karakter (huruf/angka)" maxlength="30">
      <div class="error-msg" id="errUserId"></div>

      <label>Nomor WhatsApp *</label>
      <input type="tel" id="noHp" placeholder="08xxxxxxxxxx (min 10 digit)">
      <div class="error-msg" id="errWa"></div>

      <hr class="divider">

      <label style="margin-bottom:10px">Pilih Pertandingan & Isi Tebakan</label>
      <div class="matches-list" id="matchesList">
        <div style="color:rgba(255,255,255,0.5);font-size:13px;text-align:center;padding:16px">⏳ Memuat...</div>
      </div>
      <div class="error-msg" id="errMatch"></div>

      <button class="btn" id="submitBtn" onclick="handleSubmit()">
        📅 Submit & Hubungkan Calendar
      </button>
    </div>

  </div>
</div>

<script>
  // URL untuk Apps Script, OAuth CLIENT_ID, dan URL dasar.
  // Ganti dengan nilai yang benar dari deploy GAS Anda.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1G85WVH53xRcoPsKNMlniRQXObUlvF47kegtaQlUptTnkclMngnWtRTApvVx4WwQ3/exec';
  const CLIENT_ID       = '69593145654-5c2n90v8f3cetmtjl91u7ua00rg7rub2.apps.googleusercontent.com';
  const BASE_URL        = 'https://pildun-form.vercel.app';

  let matches     = [];
  let currentUser = null;
  let activeMatch = -1; // accordion — index yang sedang terbuka

  // ── Load config ──
  async function loadConfig() {
    try {
      const r = await fetch(APPS_SCRIPT_URL + '?action=getConfig');
      const d = await r.json();
      matches = d.data || [];
      
      // Tambah pengecekan karena ID sudah dihapus dari HTML
      const titleEl = document.getElementById('pageTitle');
      const subtitleEl = document.getElementById('pageSubtitle');
      if (d.title && titleEl)    titleEl.textContent    = d.title;
      if (d.subtitle && subtitleEl) subtitleEl.textContent = d.subtitle;
    } catch(e) { matches = []; }
  }

  // ── Render match accordion ──
  function renderMatches() {
    const list = document.getElementById('matchesList');
    if (!matches.length) {
      list.innerHTML = '<div style="color:rgba(255,255,255,0.5);font-size:13px;text-align:center;padding:16px">Belum ada pertandingan tersedia</div>';
      return;
    }
    list.innerHTML = matches.map((m, i) => `
      <div class="match-card" id="match-${i}" onclick="toggleMatch(${i})">
        <div class="match-header">
          <div class="match-checkbox"><span class="match-checkbox-tick">✓</span></div>
          <div class="match-title">${m.pertandingan}</div>
          <div class="match-time">${m.tanggal ? m.tanggal + ' ' + m.jam : m.jam || ''}</div>
        </div>
        <div class="match-preview" id="preview-${i}">Tebakan: 0 - 0</div>
        <div class="score-section" onclick="event.stopPropagation()">
          <div class="score-row">
            <div class="score-col">
              <div class="team-label">${m.timA}</div>
              <input type="number" id="scoreA-${i}" min="0" max="20" value="0">
            </div>
            <div class="vs-badge">VS</div>
            <div class="score-col">
              <div class="team-label">${m.timB}</div>
              <input type="number" id="scoreB-${i}" min="0" max="20" value="0">
            </div>
          </div>
          <button class="btn-confirm" onclick="confirmMatch(${i})">✓ Simpan Tebakan</button>
        </div>
      </div>
    `).join('');
  }

  // ── Toggle accordion ──
  function toggleMatch(i) {
    const card = document.getElementById('match-' + i);

    // Tutup yang sebelumnya aktif
    if (activeMatch !== -1 && activeMatch !== i) {
      const prev = document.getElementById('match-' + activeMatch);
      if (prev) prev.classList.remove('active');
    }

    // Toggle yang diklik
    if (activeMatch === i) {
      card.classList.remove('active');
      activeMatch = -1;
    } else {
      card.classList.add('active');
      activeMatch = i;
    }

    document.getElementById('errMatch').textContent = '';
  }

  // ── Konfirmasi skor 1 match ──
  function confirmMatch(i) {
    const sA = document.getElementById('scoreA-' + i).value || '0';
    const sB = document.getElementById('scoreB-' + i).value || '0';
    const card = document.getElementById('match-' + i);
    const preview = document.getElementById('preview-' + i);

    // Update preview
    preview.textContent = 'Tebakan: ' + sA + ' - ' + sB;

    // Mark as done, tutup accordion
    card.classList.add('done');
    card.classList.remove('active');
    activeMatch = -1;
  }

  // ── Validasi ──
  function validateUserId(val) {
    if (!val || val.length < 4) return 'User ID minimal 4 karakter';
    if (!/^[a-zA-Z0-9]+$/.test(val)) return 'User ID hanya boleh huruf dan angka';
    return '';
  }
  function validateWa(val) {
    if (!val) return 'Nomor WhatsApp wajib diisi';
    if (!/^\d+$/.test(val)) return 'Nomor WhatsApp hanya boleh angka';
    if (val.length < 10) return 'Nomor WhatsApp minimal 10 digit';
    return '';
  }

  // ── Submit ──
  async function handleSubmit() {
    const userId = document.getElementById('userId').value.trim();
    const noHp   = document.getElementById('noHp').value.trim();

    const errUID = validateUserId(userId);
    const errWA  = validateWa(noHp);
    document.getElementById('errUserId').textContent = errUID;
    document.getElementById('errWa').textContent     = errWA;
    if (errUID || errWA) return;

    // Kumpulkan match yang sudah di-confirm (class 'done')
    const selected = matches.map((m, i) => {
      const card = document.getElementById('match-' + i);
      if (!card || !card.classList.contains('done')) return null;
      return {
        pertandingan: m.pertandingan,
        timA: m.timA, timB: m.timB,
        skorA: document.getElementById('scoreA-' + i)?.value || '0',
        skorB: document.getElementById('scoreB-' + i)?.value || '0'
      };
    }).filter(Boolean);

    if (!selected.length) {
      document.getElementById('errMatch').textContent = 'Pilih dan simpan minimal 1 pertandingan';
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Memproses...';

    // Cek apakah email sudah authorized di DB_Auth
    try {
      const checkRes = await fetch(APPS_SCRIPT_URL + '?action=checkEmail&email=' + encodeURIComponent(currentUser.email));
      const checkData = await checkRes.json();

      if (checkData.authorized) {
        // Sudah authorized — langsung save tanpa OAuth Calendar
        const saveRes = await fetch(APPS_SCRIPT_URL + '?action=saveOnly&' + new URLSearchParams({
          email: currentUser.email,
          nama:  currentUser.name,
          userId, noHp,
          matches: JSON.stringify(selected)
        }));
        const saveData = await saveRes.json();
        if (saveData.success) {
          window.location.href = '/success.html?status=success&name=' + encodeURIComponent(currentUser.name);
        } else {
          btn.disabled = false;
          btn.textContent = '📅 Submit & Hubungkan Calendar';
          alert('Gagal simpan data: ' + (saveData.error || 'Unknown'));
        }
        return;
      }
    } catch(e) {
      // Kalau cek gagal, lanjut ke OAuth flow biasa
    }

    // Belum authorized — OAuth Calendar
    const state = encodeURIComponent([
      'calendar',
      currentUser.email,
      currentUser.name,
      userId,
      noHp,
      encodeURIComponent(JSON.stringify(selected))
    ].join('|'));

    window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth'
      + '?client_id='    + encodeURIComponent(CLIENT_ID)
      + '&redirect_uri=' + encodeURIComponent(BASE_URL + '/api/callback')
      + '&response_type=code'
      + '&scope='        + encodeURIComponent('https://www.googleapis.com/auth/calendar')
      + '&access_type=offline'
      + '&prompt=consent'
      + '&state='        + state;
  }

  // ── Show section helper ──
  function showSection(id) {
    ['splashSection','loginSection','formSection'].forEach(s => {
      const el = document.getElementById(s);
      if (el) el.style.display = 'none';
    });
    const target = document.getElementById(id);
    if (target) { 
        // Menggunakan flex untuk login section agar sentral
        if (id === 'loginSection') {
            target.style.display = 'flex';
        } else {
            target.style.display = 'block';
        }
        target.classList.add('fade-in'); 
    }
  }

  // ── Show form ──
  function showForm(email, name, animate) {
    currentUser = { email, name };
    localStorage.setItem('pildun_user', JSON.stringify(currentUser));
    showSection('formSection');
    document.getElementById('userName').textContent   = name;
    document.getElementById('userEmail').textContent  = email;
    document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
    renderMatches();
  }

  // ── Logout ──
  function logout() {
    localStorage.removeItem('pildun_user');
    currentUser = null;
    showSection('loginSection');
  }

  // ── Google Login ──
  function loginGoogle() {
    window.location.href = '/api/auth?state=login';
  }

  // ── Init ──
  window.onload = async function() {
    // Load config dulu sebelum cek localStorage
    await loadConfig();

    // Cek apakah balik dari OAuth login
    const params = new URLSearchParams(window.location.search);
    const email  = params.get('email');
    const name   = params.get('name');
    const step   = params.get('step');

    if (email && step === 'form') {
      window.history.replaceState({}, '', '/');
      // Tunggu matches loaded dulu
      await new Promise(r => setTimeout(r, 1500));
      showForm(email, name || email, true);
      return;
    }

    // Tampilkan login screen sentral secara langsung
    showSection('loginSection');
  };
</script>
</body>
</html>
