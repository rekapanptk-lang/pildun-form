<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sumbutogel - Tebak Skor Gacor</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-red: #cc0000;
      --dark-red: #1a0000;
      --accent-yellow: #ffdc00;
    }

    body { font-family: 'Inter', Arial, sans-serif; min-height: 100vh; background: var(--dark-red); margin: 0; }

    .card {
      position: relative; width: 100%; max-width: 480px; min-height: 100vh;
      margin: 0 auto; overflow: hidden; background: #000;
    }

    /* Background Tetap JPG */
    .card-bg { position: absolute; inset: 0; background: url('bg.jpg') center/cover; }

    /* Overlay Merah Tipis (Sesuai request lo bray) */
    .card-overlay {
      position: absolute; inset: 0;
      background: rgba(150, 0, 0, 0.4);
      z-index: 1;
    }

    .card-content { position: relative; z-index: 2; padding: 40px 25px; }

    /* GIF Logo Diperbesar & Elegan */
    .logo-img { width: 260px; height: auto; display: block; margin: 0 auto 30px; }

    /* Tombol Google Atraksi (Glow + Pulse) */
    .google-btn {
      width: 100%; padding: 15px; background: white; border: none; border-radius: 50px;
      font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
      animation: pulseBtn 2s infinite;
      transition: 0.3s;
    }
    @keyframes pulseBtn {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.5); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255,255,255,0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }
    .google-btn:hover { background: var(--accent-yellow); }

    input { width: 100%; padding: 15px; background: rgba(0,0,0,0.5); border: 2px solid white; border-radius: 10px; color: white; margin-bottom: 15px; }
    .btn-submit { width: 100%; padding: 15px; background: var(--accent-yellow); border: none; border-radius: 10px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>

<div class="card">
  <div class="card-bg"></div>
  <div class="card-overlay"></div>
  
  <div class="card-content">
    <div id="loginSection">
      <a href="https://sumbu.link">
        <img src="https://dash.takenupload.org/GIf-SMBT-NEW-340" alt="Sumbutogel" class="logo-img">
      </a>
      <button class="google-btn" onclick="loginGoogle()">
        Login Lanjutkan dengan Google
      </button>
    </div>

    <div id="formSection" style="display:none;">
      <img src="https://dash.takenupload.org/GIf-SMBT-NEW-340" alt="Sumbutogel" class="logo-img">
      <input type="text" id="userId" placeholder="User ID">
      <div id="matchesList"></div>
      <button class="btn-submit" onclick="submitData()">SIMPAN TEBAKAN</button>
    </div>
  </div>
</div>

<script>
  // Script di sini akan menangani data match supaya gak hilang bray

    try {
      const response = await fetch('YOUR_APPS_SCRIPT_URL_HERE');

    } catch(e) {
      document.getElementById('matchesList').innerHTML = "<p style='color:white; text-align:center'>Lagi update match gacor bray, sabar ya!</p>";
    }
  }
  
  function loginGoogle() { /* Logic Auth */ }
  function submitData() { /* Logic Submit */ }
</script>

</body>
</html>
