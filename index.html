<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sumbutogel - Tebak Skor Piala Dunia FIFA 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-red: #cc0000;
      --dark-red: #1a0000;
      --rb1: #ff0000;
      --rb2: #ffdc00;
      --rb3: #00ff00;
      --rb4: #00ffff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--dark-red); margin: 0; padding: 0; overflow-x: hidden;
    }

    /* ── CARD ── */
    .card {
      position: relative; width: 100%; max-width: 600px; height: 100vh;
      border-radius: 0; overflow: hidden; display: flex; flex-direction: column;
      z-index: 1; border: 4px solid transparent;
    }
    .card::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(var(--rb1), var(--rb2), var(--rb3), var(--rb4), var(--rb1));
      animation: rotateBorder 4s linear infinite; z-index: -2;
    }
    .card::after { content: ''; position: absolute; inset: 0; background: var(--dark-red); z-index: -1; }
    @keyframes rotateBorder { 100% { transform: rotate(360deg); } }

    .card-bg {
      position: absolute; inset: 0;
      background-image: url('bg.webp');
      background-size: cover; background-position: center top; background-repeat: no-repeat; z-index: 0;
    }
    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(200,0,0,0.70) 0%, rgba(140,0,0,0.70) 40%, rgba(80,0,0,0.80) 100%);
      z-index: 1;
    }
    .card-content {
      position: relative; z-index: 2; height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 24px 24px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    .card-content::-webkit-scrollbar { width: 4px; }
    .card-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    @media (min-width: 600px) {
      body { padding: 20px; }
      .card { height: auto; max-width: 480px; border-radius: 24px; box-shadow: 0 32px 80px rgba(0,0,0,0.6); border: 5px solid transparent; }
      .card::after { border-radius: 20px; }
      .card-content { height: 85vh; max-height: 800px; min-height: 500px; }
    }

    /* ── LOGO ── */
    .logo-gif {
      width: 325px; max-width: 100%; height: auto;
      flex-shrink: 0; display: block; margin-top: 0;
      animation: floatGlow 3s ease-in-out infinite;
    }
    @keyframes floatGlow {
      0%,100% { transform: translateY(0px);   filter: drop-shadow(0 0 8px rgba(255,220,0,0.4)); }
      50%      { transform: translateY(-10px); filter: drop-shadow(0 0 20px rgba(255,220,0,0.8)); }
    }

    /* ── SECTIONS ── */
    #loginSection, #formSection { display: none; width: 100%; flex-direction: column; align-items: center; }
    #loginSection { flex: 1; justify-content: flex-start; padding-bottom: 0; }
    #formSection  { flex: 1; justify-content: flex-start; }
    .form-spacer-top    { flex: 1; min-height: 6px; max-height: 20px; }
    .form-spacer-bottom { flex: 1; min-height: 8px; }
    .form-body { width: 100%; }

    /* ── WINNER BUTTON ── */
    .winner-link {
      display: block; text-align: center; color: #1a0000; font-size: 13px; font-weight: 700;
      text-decoration: none; cursor: pointer; padding: 8px 20px; letter-spacing: 0.5px;
      flex-shrink: 0; border-radius: 20px; width: auto;
      background: linear-gradient(135deg, #ffdc00, #ffa500);
      box-shadow: 0 0 10px rgba(255,220,0,0.5);
      animation: pulseWinner 1.5s ease-in-out infinite;
      margin: 4px 0;
    }
    .winner-link:hover { opacity: 0.9; }
    @keyframes pulseWinner {
      0%,100% { box-shadow: 0 0 10px rgba(255,220,0,0.5); transform: scale(1); }
      50%      { box-shadow: 0 0 20px rgba(255,220,0,0.8); transform: scale(1.02); }
    }

    /* ── GOOGLE BTN dengan running border ── */
    .google-btn-wrap {
      position: relative; width: 100%; padding: 3px;
      border-radius: 14px; overflow: hidden;
    }
    .google-btn-wrap::before {
      content: ''; position: absolute; top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(var(--rb1), var(--rb2), var(--rb3), var(--rb4), var(--rb1));
      animation: rotateBorder 2s linear infinite; z-index: 0;
    }
    .google-btn {
      position: relative; z-index: 1;
      width: 100%; padding: 13px;
      background: linear-gradient(145deg, #ffffff 0%, #e8e8e8 45%, #cfcfcf 100%);
      color: #333; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.3s ease;
    }
    .google-btn:hover { background: white; }

    /* ── INPUTS ── */
    label {
      display: block; font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.8); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    input[type=text], input[type=tel] {
      width: 100%; padding: 12px 16px; background: #800000; border: 3px solid #ffffff;
      border-radius: 12px; font-size: 14px; font-weight: 500; color: white; outline: none;
      transition: all 0.2s ease; font-family: inherit; margin-bottom: 16px;
    }
    input[type=text]::placeholder, input[type=tel]::placeholder { color: rgba(255,255,255,0.5); }
    input[type=text]:focus, input[type=tel]:focus {
      background: #a30000; border-color: #ffdc00;
      transform: scale(1.02); box-shadow: 0 0 15px rgba(255,220,0,0.5);
    }
    input[type=number] {
      width: 100%; padding: 10px; background: #800000; border: 3px solid #ffffff;
      border-radius: 12px; text-align: center; font-size: 26px; font-weight: 700;
      color: white; outline: none; font-family: inherit; transition: all 0.2s ease;
    }
    input[type=number]:focus { background: #a30000; border-color: #ffdc00; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px #800000 inset !important;
      -webkit-text-fill-color: white !important;
    }
    .error-msg { color: #ffb3b3; font-size: 11px; margin-top: -12px; margin-bottom: 14px; display: block; }

    /* ── MATCH CARDS ── */
    .matches-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .match-card {
      background: #800000; border: 3px solid #ffffff; border-radius: 14px;
      overflow: hidden; cursor: pointer; transition: all 0.2s ease;
    }
    .match-card.active { background: #a30000; transform: scale(1.02); border-color: #ffdc00; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .match-card.done   { border-color: #ffdc00; background: #5c0000; animation: pulseDone 2s infinite; }
    @keyframes pulseDone {
      0%,100% { box-shadow: 0 0 10px rgba(255,220,0,0.4); }
      50%      { box-shadow: 0 0 20px rgba(255,220,0,0.6); }
    }
    .match-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; user-select: none; }
    .match-checkbox {
      width: 18px; height: 18px; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.5);
      border-radius: 5px; background: transparent;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
    }
    .match-card.active .match-checkbox,
    .match-card.done  .match-checkbox { background: white; border-color: white; }
    .match-checkbox-tick { color: var(--primary-red); font-size: 11px; font-weight: 900; display: none; }
    .match-card.active .match-checkbox-tick,
    .match-card.done  .match-checkbox-tick { display: block; }
    .match-title { font-weight: 700; font-size: 13px; color: white; flex: 1; }
    .match-time  { font-size: 10px; color: rgba(255,255,255,0.7); white-space: nowrap; }
    .match-preview { display: none; padding: 4px 16px 6px; font-size: 12px; color: #ffdc00; font-weight: 600; }
    .match-card.done:not(.active) .match-preview { display: block; }
    .match-cancel-hint { display: none; padding: 0 16px 10px; font-size: 10px; color: rgba(255,255,255,0.4); }
    .match-card.done:not(.active) .match-cancel-hint { display: block; }
    .score-section { display: none; padding: 4px 16px 16px; }
    .match-card.active .score-section { display: block; }
    .score-row { display: flex; align-items: center; gap: 12px; }
    .score-col { flex: 1; text-align: center; }
    .team-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.9); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vs-badge {
      background: rgba(255,255,255,0.2); color: white; font-weight: 800; font-size: 12px;
      padding: 6px 10px; border-radius: 8px; flex-shrink: 0; align-self: center; margin-top: 20px;
      animation: pulseVs 1.5s infinite;
    }
    @keyframes pulseVs {
      0%,100% { transform: scale(1);   background: rgba(255,255,255,0.2); }
      50%      { transform: scale(1.1); background: rgba(255,255,255,0.3); }
    }
    .btn-confirm {
      width: 100%; padding: 10px; background: #a30000; color: white;
      border: 1px solid #ffffff; border-radius: 10px; font-size: 13px; font-weight: 700;
      cursor: pointer; margin-top: 12px; transition: all 0.15s ease;
    }
    .btn-confirm:hover { background: #cc0000; transform: translateY(-1px); }
    .note-wajib { color: rgba(255,255,255,0.5); font-size: 10px; display: block; text-align: center; margin-top: 6px; }

    /* ── SUBMIT BTN dengan running border ── */
    .btn-wrap {
      position: relative; width: 100%; padding: 3px;
      border-radius: 14px; overflow: hidden; margin-top: 4px;
    }
    .btn-wrap::before {
      content: ''; position: absolute; top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(var(--rb1), var(--rb2), var(--rb3), var(--rb4), var(--rb1));
      animation: rotateBorder 2s linear infinite; z-index: 0;
    }
    .btn {
      position: relative; z-index: 1;
      width: 100%; padding: 15px;
      background: linear-gradient(270deg, #ff4444, #cc0000, #990000);
      background-size: 600% 600%;
      color: white; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      animation: moveGradient 4s ease infinite;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; animation: none; }
    @keyframes moveGradient {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.15); margin: 16px 0; }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ── MUSIK ── */
    #musicControls { position: fixed; bottom: 15px; right: 15px; z-index: 100; display: none; }
    .btn-music {
      background: rgba(255,255,255,0.1); border: 2px solid white; color: white;
      border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: all 0.2s ease;
    }
    .btn-music:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
    .btn-music.playing { border-color: #ffdc00; color: #ffdc00; animation: pulseMusic 2s infinite; }
    @keyframes pulseMusic {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,220,0,0.7); }
      70%      { box-shadow: 0 0 0 10px rgba(255,220,0,0); }
    }

    /* ── WINNER OVERLAY ── */
    .winner-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 200;
      align-items: center; justify-content: center; padding: 20px;
    }
    .winner-overlay.show { display: flex; }
    .winner-modal {
      background: #1a0000; border: 2px solid #ffdc00; border-radius: 16px;
      width: 100%; max-width: 420px; max-height: 80vh;
      display: flex; flex-direction: column; overflow: hidden;
      animation: fadeIn 0.3s ease;
    }
    .winner-modal-head {
      padding: 14px 20px; background: linear-gradient(135deg, #8b0000, #cc0000);
      display: flex; flex-direction: column; gap: 2px; flex-shrink: 0;
    }
    .winner-modal-head-row { display: flex; align-items: center; justify-content: space-between; }
    .winner-modal-head h2 { font-size: 15px; color: #ffdc00; font-family: 'Oswald', sans-serif; letter-spacing: 1px; }
    .winner-modal-head .winner-date-sub { font-size: 12px; color: rgba(255,255,255,0.7); }
    .winner-close { background: transparent; border: none; color: white; font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; }
    .winner-list {
      overflow-y: auto; padding: 12px 16px;
      scrollbar-width: thin; scrollbar-color: rgba(255,220,0,0.3) transparent;
    }
    .winner-list::-webkit-scrollbar { width: 4px; }
    .winner-list::-webkit-scrollbar-thumb { background: rgba(255,220,0,0.3); border-radius: 4px; }
    .winner-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; margin-bottom: 8px;
      background: rgba(255,220,0,0.08); border: 1px solid rgba(255,220,0,0.3); border-radius: 10px;
    }
    .winner-rank  { font-size: 20px; flex-shrink: 0; }
    .winner-info  { flex: 1; }
    .winner-userid { font-weight: 700; font-size: 14px; color: #ffdc00; }
    .winner-match  { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 2px; }
    .winner-prize  { font-size: 12px; font-weight: 700; color: #4caf50; white-space: nowrap; }
    .winner-date   { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; }
    .winner-empty  { text-align: center; color: rgba(255,255,255,0.6); font-size: 13px; padding: 24px; line-height: 1.8; }
  </style>
</head>
<body>
<audio id="bgMusic" src="https://raw.githubusercontent.com/rekapanptk-lang/Event-Tebak-Score/main/music.mp3" loop></audio>

<div id="musicControls">
  <button id="musicBtn" class="btn-music" onclick="toggleMusic()">🎵</button>
</div>

<!-- WINNER OVERLAY -->
<div class="winner-overlay" id="winnerOverlay" onclick="closeWinnerOutside(event)">
  <div class="winner-modal">
    <div class="winner-modal-head">
      <div class="winner-modal-head-row">
        <h2>🏆 PEMENANG TEBAK SCORE</h2>
        <button class="winner-close" onclick="closeWinner()">✕</button>
      </div>
      <div class="winner-date-sub" id="winnerDateSub"></div>
    </div>
    <div class="winner-list" id="winnerList">
      <div class="winner-empty">⏳ Memuat data pemenang...</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-bg"></div>
  <div class="card-overlay"></div>
  <div class="card-content">

    <!-- LOGIN SECTION -->
    <div id="loginSection">
      <img src="logo.webp" alt="Sumbutogel" class="logo-gif">
      <span class="winner-link" onclick="openWinner()">🏆 LIHAT DAFTAR PEMENANG</span>
      <div style="flex:1"></div>
      <div class="google-btn-wrap">
        <button class="google-btn" onclick="loginGoogle()">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Lanjutkan dengan Google
        </button>
      </div>
      <div style="flex:1"></div>
    </div>

    <!-- FORM SECTION -->
    <div id="formSection">
      <img src="logo.webp" alt="Sumbutogel" class="logo-gif">
      <span class="winner-link" onclick="openWinner()">🏆 LIHAT DAFTAR PEMENANG</span>

      <div class="form-spacer-top"></div>

      <div class="form-body">
        <label>User ID *</label>
        <input type="text" id="userId" placeholder="Ketik User ID Anda" maxlength="30">
        <div class="error-msg" id="errUserId"></div>

        <label>Nomor WhatsApp *</label>
        <input type="tel" id="noHp" placeholder="08xxxxxxxxxx">
        <div class="error-msg" id="errWa"></div>

        <hr class="divider">

        <label style="margin-bottom:12px; color:#ffdc00;">Pilih Pertandingan & Isi Tebakan</label>
        <div class="matches-list" id="matchesList">
          <div style="color:rgba(255,255,255,0.8);font-size:13px;text-align:center;padding:16px">⏳ Memuat pertandingan gacor...</div>
        </div>
        <div class="error-msg" id="errMatch"></div>

        <div class="btn-wrap">
          <button class="btn" id="submitBtn" onclick="handleSubmit()">KIRIM TEBAKAN SKOR</button>
        </div>
      </div>

      <div class="form-spacer-bottom"></div>
    </div>

  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1G85WVH53xRcoPsKNMlniRQXObUlvF47kegtaQlUptTnkclMngnWtRTApvVx4WwQ3/exec';
  const CLIENT_ID       = '69593145654-5c2n90v8f3cetmtjl91u7ua00rg7rub2.apps.googleusercontent.com';
  const BASE_URL        = 'https://pildun-form.vercel.app';

  let matches     = [];
  let currentUser = null;
  let activeMatch = -1;
  let isPlaying   = false;

  const music    = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');

  // ── MUSIK ──
  function toggleMusic() {
    if (isPlaying) {
      music.pause(); musicBtn.classList.remove('playing'); musicBtn.textContent = '🎵';
    } else {
      music.play().catch(() => {}); musicBtn.classList.add('playing'); musicBtn.textContent = '⏸️';
    }
    isPlaying = !isPlaying;
  }

  function startMusic() {
    music.volume = 0.2;
    document.getElementById('musicControls').style.display = 'block';
    music.play().catch(() => {});
    musicBtn.classList.add('playing');
    musicBtn.textContent = '⏸️';
    isPlaying = true;
  }

  function stopMusic() {
    document.getElementById('musicControls').style.display = 'none';
    music.pause();
    musicBtn.classList.remove('playing');
    musicBtn.textContent = '🎵';
    isPlaying = false;
  }

  // ── LOAD CONFIG ──
  async function loadConfig() {
    try {
      const r = await fetch(APPS_SCRIPT_URL + '?action=getConfig');
      const d = await r.json();
      matches = d.data || [];
    } catch(e) { matches = []; }
  }

  // ── RENDER MATCHES ──
  function renderMatches() {
    const list = document.getElementById('matchesList');
    if (!list) return;
    if (!matches.length) {
      list.innerHTML = '<div style="color:rgba(255,255,255,0.8);font-size:13px;text-align:center;padding:16px">Belum ada pertandingan tersedia</div>';
      return;
    }
    list.innerHTML = matches.map((m, i) => `
      <div class="match-card" id="match-${i}" onclick="toggleMatch(${i})">
        <div class="match-header">
          <div class="match-checkbox"><span class="match-checkbox-tick">✓</span></div>
          <div class="match-title">${m.pertandingan}</div>
          <div class="match-time">${m.tanggal ? m.tanggal + ' | ' + m.jam : m.jam || ''}</div>
        </div>
        <div class="match-preview" id="preview-${i}">Tebakan: 0 - 0</div>
        <div class="match-cancel-hint">Klik untuk ubah tebakan</div>
        <div class="score-section" onclick="event.stopPropagation()">
          <div class="score-row">
            <div class="score-col">
              <div class="team-label">${m.timA}</div>
              <input type="number" id="scoreA-${i}" min="0" max="20" placeholder="0">
            </div>
            <div class="vs-badge">VS</div>
            <div class="score-col">
              <div class="team-label">${m.timB}</div>
              <input type="number" id="scoreB-${i}" min="0" max="20" placeholder="0">
            </div>
          </div>
          <button class="btn-confirm" onclick="confirmMatch(${i})">✓ Simpan Tebakan</button>
          <small class="note-wajib">*Wajib Betting sebelum Ikut Tebak Score</small>
        </div>
      </div>
    `).join('');
  }

  // ── ACCORDION ──
  function toggleMatch(i) {
    const card = document.getElementById('match-' + i);
    if (card.classList.contains('done') && !card.classList.contains('active')) {
      card.classList.remove('done'); card.classList.add('active');
      const sA = document.getElementById('scoreA-' + i);
      const sB = document.getElementById('scoreB-' + i);
      if (sA) sA.value = ''; if (sB) sB.value = '';
      if (activeMatch !== -1 && activeMatch !== i) {
        const prev = document.getElementById('match-' + activeMatch);
        if (prev) prev.classList.remove('active');
      }
      activeMatch = i;
      document.getElementById('errMatch').textContent = '';
      setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
      return;
    }
    if (activeMatch !== -1 && activeMatch !== i) {
      const prev = document.getElementById('match-' + activeMatch);
      if (prev) prev.classList.remove('active');
    }
    if (activeMatch === i) {
      card.classList.remove('active'); activeMatch = -1;
    } else {
      card.classList.add('active'); activeMatch = i;
      setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
    }
    document.getElementById('errMatch').textContent = '';
  }

  // ── CONFIRM MATCH ──
  function confirmMatch(i) {
    let sA = document.getElementById('scoreA-' + i).value || '0';
    let sB = document.getElementById('scoreB-' + i).value || '0';
    document.getElementById('preview-' + i).textContent = 'Tebakan: ' + sA + ' - ' + sB;
    const card = document.getElementById('match-' + i);
    card.classList.add('done'); card.classList.remove('active'); activeMatch = -1;
  }

  // ── VALIDASI ──
  function validateUserId(val) {
    if (!val || val.length < 4) return 'User ID minimal 4 karakter';
    if (!/^[a-zA-Z0-9]+$/.test(val)) return 'User ID cuma boleh huruf & angka';
    return '';
  }
  function validateWa(val) {
    if (!val) return 'Nomor WA wajib diisi';
    if (!/^\d+$/.test(val)) return 'Nomor WA cuma boleh angka';
    if (val.length < 10) return 'Nomor WA minimal 10 digit';
    return '';
  }

  // ── AUTO FILL ──
  function autoFillForm() {
    try {
      const extra = localStorage.getItem('pildun_extra');
      if (extra) {
        const { userId, noHp } = JSON.parse(extra);
        if (userId) document.getElementById('userId').value = userId;
        if (noHp)   document.getElementById('noHp').value   = noHp;
      }
    } catch(e) {}
  }

  // ── SUBMIT — dengan checkEmail + Calendar OAuth ──
  async function handleSubmit() {
    if (!currentUser || !currentUser.email) {
      alert('Session habis, silakan login ulang.');
      showSection('loginSection'); return;
    }

    const userId = document.getElementById('userId').value.trim();
    const noHp   = document.getElementById('noHp').value.trim();
    const errUID = validateUserId(userId);
    const errWA  = validateWa(noHp);
    document.getElementById('errUserId').textContent = errUID;
    document.getElementById('errWa').textContent     = errWA;
    if (errUID || errWA) return;

    const selected = matches.map((m, i) => {
      const card = document.getElementById('match-' + i);
      if (!card || !card.classList.contains('done')) return null;
      let sA = document.getElementById('scoreA-' + i)?.value || '0';
      let sB = document.getElementById('scoreB-' + i)?.value || '0';
      if (sA === '') sA = '0'; if (sB === '') sB = '0';
      return { pertandingan: m.pertandingan, timA: m.timA, timB: m.timB, skorA: sA, skorB: sB };
    }).filter(Boolean);

    if (!selected.length) {
      document.getElementById('errMatch').textContent = 'Wajib Menebak 1 Match!';
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'PROSES';
    localStorage.setItem('pildun_extra', JSON.stringify({ userId, noHp }));

    // Timestamp WIB
    const now = new Date();
    const wib = new Date(now.getTime() + (7 * 60 * 60 * 1000));
    const tglArr = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const tglStr = wib.getUTCDate() + ' ' + tglArr[wib.getUTCMonth()] + ' ' + wib.getUTCFullYear();
    const jamStr = String(wib.getUTCHours()).padStart(2,'0') + ':' + String(wib.getUTCMinutes()).padStart(2,'0') + ' WIB';
    const timestamp = tglStr + ' | ' + jamStr;

    // Cek apakah sudah authorized Calendar
    try {
      const checkRes  = await fetch(APPS_SCRIPT_URL + '?action=checkEmail&email=' + encodeURIComponent(currentUser.email));
      const checkData = await checkRes.json();

      if (checkData.authorized) {
        // Sudah authorized — langsung save
        const saveRes  = await fetch(APPS_SCRIPT_URL + '?action=saveOnly&' + new URLSearchParams({
          email: currentUser.email, nama: currentUser.name, userId, noHp, matches: JSON.stringify(selected)
        }));
        const saveData = await saveRes.json();
        if (saveData.success) {
          sessionStorage.setItem('pildun_rekap', JSON.stringify({ name: currentUser.name, timestamp, matches: selected }));
          window.location.href = '/success.html';
        } else {
          btn.disabled = false; btn.textContent = 'KIRIM TEBAKAN SKOR';
          alert('Gagal simpan data: ' + (saveData.error || 'Unknown'));
        }
        return;
      }
    } catch(e) { /* lanjut OAuth */ }

    // Belum authorized — OAuth Calendar
    const state = encodeURIComponent([
      'calendar', currentUser.email, currentUser.name,
      userId, noHp, encodeURIComponent(JSON.stringify(selected))
    ].join('|'));

    window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth'
      + '?client_id='    + encodeURIComponent(CLIENT_ID)
      + '&redirect_uri=' + encodeURIComponent(BASE_URL + '/api/callback')
      + '&response_type=code'
      + '&scope='        + encodeURIComponent('https://www.googleapis.com/auth/calendar')
      + '&access_type=offline'
      + '&prompt=consent'
      + '&state='        + state;
  }

  // ── SHOW SECTION ──
  function showSection(id) {
    ['loginSection', 'formSection'].forEach(s => {
      const el = document.getElementById(s);
      if (el) el.style.display = 'none';
    });
    const target = document.getElementById(id);
    if (target) { target.style.display = 'flex'; target.classList.add('fade-in'); }
    document.getElementById('musicControls').style.display = isPlaying ? 'block' : 'none';
  }

  // ── SHOW FORM ──
  function showForm(email, name) {
    currentUser = { email, name };
    localStorage.setItem('pildun_user', JSON.stringify(currentUser));
    showSection('formSection');
    renderMatches();
    autoFillForm();
    setTimeout(() => openWinner(), 500);
  }

  // ── LOGIN ──
  function loginGoogle() { window.location.href = '/api/auth?state=login'; }

  // ── WINNER POPUP ──
  let winnersCache = null;

  function getYesterdayStr() {
    const tglArr = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return d.getDate() + ' ' + tglArr[d.getMonth()] + ' ' + d.getFullYear();
  }

  async function openWinner() {
    document.getElementById('winnerDateSub').textContent = getYesterdayStr();
    document.getElementById('winnerOverlay').classList.add('show');
    if (winnersCache !== null) { renderWinners(winnersCache); return; }
    try {
      const r = await fetch(APPS_SCRIPT_URL + '?action=getWinners');
      const d = await r.json();
      winnersCache = d.winners || [];
      renderWinners(winnersCache);
    } catch(e) {
      document.getElementById('winnerList').innerHTML = '<div class="winner-empty">Gagal load data pemenang</div>';
    }
  }

  function renderWinners(winners) {
    const list = document.getElementById('winnerList');
    if (!winners.length) {
      list.innerHTML = '<div class="winner-empty">Belum ada pemenang<br><br>Jadilah Pemenang Pertama kami 🏆</div>'; return;
    }
    const medals = ['🥇','🥈','🥉'];
    list.innerHTML = winners.map((w, i) => `
      <div class="winner-item">
        <div class="winner-rank">${medals[i] || '🏅'}</div>
        <div class="winner-info">
          <div class="winner-userid">${w.userId}</div>
          <div class="winner-match">${w.pertandingan}</div>
          <div class="winner-date">${w.tanggal}</div>
        </div>
        <div class="winner-prize">${w.hadiah}</div>
      </div>
    `).join('');
  }

  function closeWinner() {
    document.getElementById('winnerOverlay').classList.remove('show');
    if (!isPlaying) startMusic();
  }
  function closeWinnerOutside(e) {
    if (e.target === document.getElementById('winnerOverlay')) closeWinner();
  }

  // ── INIT ──
  window.onload = async function() {
    await loadConfig();

    const params = new URLSearchParams(window.location.search);
    const email  = params.get('email');
    const name   = params.get('name');
    const step   = params.get('step');

    if (email && step === 'form') {
      window.history.replaceState({}, '', window.location.pathname);
      showForm(email, name || email);
      return;
    }

    const saved = localStorage.getItem('pildun_user');
    if (saved) {
      try {
        const u = JSON.parse(saved);
        if (u && u.email) { showForm(u.email, u.name || u.email); return; }
      } catch(e) { localStorage.removeItem('pildun_user'); }
    }

    showSection('loginSection');
    setTimeout(() => openWinner(), 800);
  };
</script>
</body>
