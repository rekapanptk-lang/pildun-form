<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berhasil - Tebak Skor Piala Dunia</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1a0000; padding: 0;
    }
    .card {
      position: relative; width: 100%; max-width: 480px; height: 100vh;
      border-radius: 0; overflow: hidden; display: flex; flex-direction: column;
    }
    .card-bg {
      position: absolute; inset: 0;
      background-image: url('bg.webp');
      background-size: cover; background-position: center top; z-index: 0;
    }
    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(200,0,0,0.70) 0%, rgba(140,0,0,0.70) 40%, rgba(80,0,0,0.80) 100%);
      z-index: 1;
    }
    .close-btn {
      position: absolute; top: 15px; right: 15px;
      width: 34px; height: 34px; background: rgba(0,0,0,0.4);
      color: white; border: 2px solid white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: bold; text-decoration: none;
      z-index: 10; transition: background 0.2s, transform 0.2s;
    }
    .close-btn:hover { background: #990000; transform: scale(1.05); }

    .card-content {
      position: relative; z-index: 2; height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 24px 28px; overflow-y: auto;
      scrollbar-width: thin;
    }

    @media (min-width: 481px) {
      body { padding: 20px; }
      .card { height: auto; border-radius: 20px; }
      .card-content { height: 85vh; max-height: 800px; }
    }

    .logo-gif {
      width: 325px; max-width: 100%; height: auto;
      flex-shrink: 0; display: block;
      animation: floatGlow 3s ease-in-out infinite;
    }
    @keyframes floatGlow {
      0%,100% { transform: translateY(0px);   filter: drop-shadow(0 0 8px rgba(255,220,0,0.4)); }
      50%      { transform: translateY(-10px); filter: drop-shadow(0 0 20px rgba(255,220,0,0.8)); }
    }

    /* tebak-gif removed */

    /* Center content */
    .center-content {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; width: 100%;
    }

    /* Success icon */
    .success-icon {
      width: 72px; height: 72px;
      background: rgba(255,255,255,0.1); border: 4px solid white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      animation: popIn 0.6s ease, glowIcon 2s ease-in-out 0.6s infinite;
    }
    @keyframes popIn {
      0%   { transform: scale(0); opacity: 0; }
      70%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes glowIcon {
      0%,100% { box-shadow: 0 0 10px rgba(255,255,255,0.3); }
      50%      { box-shadow: 0 0 24px rgba(255,255,255,0.7); }
    }

    /* Berhasil title */
    .success-title {
      font-family: 'Oswald', sans-serif; font-size: 36px; color: white;
      text-transform: uppercase; letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      animation: bounceIn 0.8s ease 0.3s both, glowText 2s ease-in-out 1.1s infinite;
    }
    @keyframes bounceIn {
      0%   { transform: scale(0.3); opacity: 0; }
      50%  { transform: scale(1.1); }
      70%  { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes glowText {
      0%,100% { text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
      50%      { text-shadow: 0 0 20px rgba(255,220,0,0.8), 0 2px 10px rgba(0,0,0,0.5); }
    }

    /* Rekap box */
    .rekap-box {
      width: 100%; background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,220,0,0.4); border-radius: 12px;
      padding: 14px 16px;
    }
    .rekap-title { font-size: 11px; font-weight: 700; color: #ffdc00; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
    .rekap-item { margin-bottom: 8px; }
    .rekap-item:last-child { margin-bottom: 0; }
    .rekap-match { font-size: 13px; font-weight: 700; color: white; }
    .rekap-skor  { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 2px; }
    .rekap-divider { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 8px 0; }
    .rekap-timestamp { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 6px; }

    /* Screenshot note */
    .screenshot-note {
      font-size: 11px; color: rgba(255,255,255,0.55);
      text-align: center; font-style: italic;
    }

    /* Kembali button */
    .back-btn {
      display: inline-block; padding: 10px 28px;
      background: linear-gradient(135deg, #ffdc00, #ffa500);
      color: #1a0000; font-size: 14px; font-weight: 700;
      border-radius: 20px; text-decoration: none;
      animation: pulseBack 1.5s ease-in-out infinite;
      box-shadow: 0 4px 15px rgba(255,220,0,0.4);
    }
    @keyframes pulseBack {
      0%,100% { transform: scale(1); box-shadow: 0 4px 15px rgba(255,220,0,0.4); }
      50%      { transform: scale(1.05); box-shadow: 0 4px 25px rgba(255,220,0,0.7); }
    }

    .fade-in { animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="card">
  <div class="card-bg"></div>
  <div class="card-overlay"></div>

  <a href="https://sumbu.link" class="close-btn" title="Tutup">✕</a>

  <div class="card-content fade-in">

    <!-- Logo atas -->
    <img src="logo.webp" alt="Sumbutogel" class="logo-gif">

    <!-- Center content -->
    <div class="center-content">

      <!-- Icon centang -->
      <div class="success-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <!-- Berhasil -->
      <h1 class="success-title">Berhasil!</h1>

      <!-- Rekap tebakan -->
      <div class="rekap-box" id="rekapBox"></div>

      <!-- Screenshot note -->
      <p class="screenshot-note">📸 Silahkan Screenshot Layar apabila diperlukan</p>

      <!-- Kembali -->
      <a href="https://sumbu.link" class="back-btn">← Kembali ke Website</a>

    </div>
  </div>
</div>

<script>
  window.onload = function() {
    // Baca dari sessionStorage
    let rekap = null;
    try {
      const raw = sessionStorage.getItem('pildun_rekap');
      if (raw) {
        rekap = JSON.parse(raw);
        sessionStorage.removeItem('pildun_rekap'); // hapus setelah dibaca
      }
    } catch(e) {}

    const name      = rekap?.name      || 'Pengguna';
    const timestamp = rekap?.timestamp || '-';
    const matches   = rekap?.matches   || [];

    const rekapBox = document.getElementById('rekapBox');
    let html = '<div class="rekap-title">📋 Rekap Tebakan Kamu</div>';

    if (matches.length) {
      matches.forEach((m, i) => {
        if (i > 0) html += '<div class="rekap-divider"></div>';
        html += `
          <div class="rekap-item">
            <div class="rekap-match">⚽ ${m.pertandingan}</div>
            <div class="rekap-skor">${m.timA} <strong style="color:#ffdc00">${m.skorA} - ${m.skorB}</strong> ${m.timB}</div>
          </div>
        `;
      });
    } else {
      html += '<div style="color:rgba(255,255,255,0.5);font-size:13px">Tidak ada data tebakan</div>';
    }

    html += `<div class="rekap-divider"></div><div class="rekap-timestamp">🕐 Dikirim pada: ${timestamp}</div>`;
    rekapBox.innerHTML = html;
  };
</script>
</body>
</html>
