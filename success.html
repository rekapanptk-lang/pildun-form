<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pildun 2026</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#1a1a2e,#0f3460);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:white;border-radius:20px;padding:48px 40px;text-align:center;max-width:440px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.4)}
    .icon{font-size:64px;margin-bottom:16px}
    h1{font-size:26px;margin-bottom:12px}
    p{color:#666;font-size:15px;line-height:1.7;margin-bottom:8px}
    .btn{display:inline-block;margin-top:24px;padding:12px 28px;background:linear-gradient(135deg,#0f3460,#533483);color:white;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px}
  </style>
</head>
<body>
<div class="card" id="card">
  <div class="icon">⏳</div>
  <h1>Memproses...</h1>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status') || 'error';
  const name   = params.get('name')   || '';
  const msg    = params.get('msg')    || '';

  const card = document.getElementById('card');

  if (status === 'success') {
    card.innerHTML = `
      <div class="icon">✅</div>
      <h1 style="color:#2e7d32">Berhasil!</h1>
      <p>Halo <strong>${decodeURIComponent(name)}</strong>!</p>
      <p>Tebakan skor kamu sudah tersimpan dan Google Calendar kamu sudah terhubung.</p>
      <p style="color:#aaa;font-size:13px;margin-top:12px">Kamu akan dapat notifikasi hasil pertandingan langsung di Google Calendar.</p>
      <p style="margin-top:16px;font-size:13px;color:#888">Kamu bisa menutup halaman ini.</p>
    `;
  } else if (status === 'cancelled') {
    card.innerHTML = `
      <div class="icon">❌</div>
      <h1 style="color:#e53935">Dibatalkan</h1>
      <p>Kamu membatalkan proses. Kalender tidak terhubung.</p>
      <a href="/" class="btn">↩ Coba Lagi</a>
    `;
  } else {
    card.innerHTML = `
      <div class="icon">⚠️</div>
      <h1 style="color:#f57c00">Ada Error</h1>
      <p>Terjadi kesalahan: <code style="background:#f5f5f5;padding:2px 6px;border-radius:4px;font-size:13px">${decodeURIComponent(msg)}</code></p>
      <a href="/" class="btn">↩ Coba Lagi</a>
    `;
  }
</script>
</body>
</html>
