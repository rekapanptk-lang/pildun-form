<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berhasil - Tebak Skor Piala Dunia</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a0000;
      padding: 0;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-bg {
      position: absolute; inset: 0;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center top;
      z-index: 0;
    }

    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(200,0,0,0.70) 0%, rgba(140,0,0,0.70) 40%, rgba(80,0,0,0.80) 100%);
      z-index: 1;
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      width: 34px; height: 34px;
      background: rgba(0,0,0,0.4);
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: bold;
      text-decoration: none;
      z-index: 10;
      transition: background 0.2s, transform 0.2s;
    }
    .close-btn:hover { background: #990000; transform: scale(1.05); }

    .card-content {
      position: relative; z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    @media (min-width: 481px) {
      body { padding: 20px; }
      .card { height: auto; border-radius: 20px; }
      .card-content { height: 85vh; max-height: 800px; }
    }

    .logo-gif {
      width: 325px;
      max-width: 100%;
      height: auto;
    }

    .success-icon {
      width: 80px; height: 80px;
      background: rgba(255,255,255,0.1);
      border: 4px solid white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: popIn 0.5s ease;
    }
    @keyframes popIn {
      0%   { transform: scale(0); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-title {
      font-family: 'Oswald', sans-serif;
      font-size: 36px; color: white;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .fade-in { animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="card">
  <div class="card-bg"></div>
  <div class="card-overlay"></div>

  <a href="https://sumbu.link" class="close-btn" title="Tutup">✕</a>

  <div class="card-content fade-in">
    <img src="https://dash.takenupload.org/GIf-SMBT-NEW-340" alt="Sumbutogel" class="logo-gif">

    <div class="success-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1 class="success-title">Berhasil!</h1>
  </div>
</div>
</body>
</html>
