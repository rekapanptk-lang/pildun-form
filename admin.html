<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Tebak Skor Piala Dunia</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f0f; color: #eee; min-height: 100vh; padding: 24px; }

    h1 { font-size: 20px; color: #ffdc00; margin-bottom: 24px; }
    h2 { font-size: 14px; color: #aaa; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }

    .panel { background: #1a1a1a; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }

    label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type=text], input[type=date], input[type=time], input[type=number], input[type=file] {
      width: 100%; padding: 10px 14px;
      background: #2a2a2a; border: 1px solid #444;
      border-radius: 8px; font-size: 14px; color: #eee;
      outline: none; font-family: inherit;
      transition: border 0.2s; margin-bottom: 14px;
    }
    input:focus { border-color: #ffdc00; }
    input[type=file] { padding: 8px; cursor: pointer; }

    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 160px; }

    /* ── RICH TEXT EDITOR ── */
    .editor-toolbar {
      display: flex; gap: 6px; flex-wrap: wrap;
      background: #222; border: 1px solid #444;
      border-bottom: none; border-radius: 8px 8px 0 0;
      padding: 8px 10px;
    }
    .editor-toolbar button {
      background: #333; border: 1px solid #555;
      color: #eee; border-radius: 5px;
      padding: 4px 10px; font-size: 13px; cursor: pointer;
      transition: all 0.15s;
    }
    .editor-toolbar button:hover { background: #444; border-color: #ffdc00; color: #ffdc00; }
    .editor-toolbar .sep { width: 1px; background: #444; margin: 0 4px; }
    .editor-content {
      min-height: 140px; padding: 12px 16px;
      background: #2a2a2a; border: 1px solid #444;
      border-radius: 0 0 8px 8px; color: #eee;
      font-size: 14px; line-height: 1.6;
      outline: none; margin-bottom: 14px;
    }
    .editor-content:focus { border-color: #ffdc00; }
    .editor-content a { color: #ffdc00; }

    /* Link dialog */
    .link-dialog {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 100;
      align-items: center; justify-content: center;
    }
    .link-dialog.show { display: flex; }
    .link-box {
      background: #1a1a1a; border: 1px solid #ffdc00;
      border-radius: 12px; padding: 20px; width: 340px;
    }
    .link-box h3 { font-size: 14px; color: #ffdc00; margin-bottom: 14px; }
    .link-box input {
      width: 100%; padding: 9px 12px;
      background: #2a2a2a; border: 1px solid #444;
      border-radius: 7px; font-size: 13px; color: #eee;
      outline: none; margin-bottom: 10px;
    }
    .link-box input:focus { border-color: #ffdc00; }
    .link-box-btns { display: flex; gap: 8px; justify-content: flex-end; }

    /* Attachment list */
    .attachment-list { margin-bottom: 14px; }
    .attachment-item {
      display: flex; align-items: center; gap: 10px;
      background: #222; border: 1px solid #444;
      border-radius: 8px; padding: 8px 12px; margin-bottom: 6px;
    }
    .attachment-item .att-name { flex: 1; font-size: 13px; color: #ccc; }
    .attachment-item .att-status { font-size: 11px; color: #888; }
    .attachment-item .att-remove {
      background: transparent; border: none; color: #ef5350;
      cursor: pointer; font-size: 16px; padding: 0 4px;
    }

    .btn {
      padding: 10px 22px; background: #ffdc00; color: #000;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-sm { padding: 6px 14px; font-size: 13px; }
    .btn-ghost { background: #333; color: #eee; border: 1px solid #555; }
    .btn-ghost:hover { background: #444; opacity: 1; }

    .result { margin-top: 14px; padding: 12px 16px; border-radius: 8px; font-size: 13px; display: none; }
    .result.ok  { background: #1a3a1a; color: #4caf50; border: 1px solid #2e7d32; }
    .result.err { background: #3a1a1a; color: #ef5350; border: 1px solid #c62828; }

    /* Stats */
    .stat { display: inline-block; background: #222; border-radius: 8px; padding: 12px 20px; margin-right: 12px; margin-bottom: 12px; }
    .stat .n { font-size: 28px; font-weight: 700; color: #ffdc00; }
    .stat .l { font-size: 12px; color: #888; margin-top: 2px; }

    /* Table */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #222; padding: 10px 12px; text-align: left; color: #888; font-size: 12px; border-bottom: 1px solid #333; }
    td { padding: 10px 12px; border-bottom: 1px solid #222; color: #ddd; }
    tr:last-child td { border-bottom: none; }
    .badge { padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .badge.ok  { background: #1a3a1a; color: #4caf50; }
    .badge.no  { background: #3a1a1a; color: #ef5350; }

    .loading { color: #888; font-size: 13px; padding: 20px; text-align: center; }

    .progress-bar {
      height: 4px; background: #333; border-radius: 2px;
      margin-top: 10px; overflow: hidden; display: none;
    }
    .progress-bar-inner { height: 100%; background: #ffdc00; width: 0; transition: width 0.3s; }
  </style>
</head>
<body>

<h1>⚽ Admin Panel — Tebak Skor Piala Dunia</h1>

<!-- STATS -->
<div id="statsBox"><div class="loading">⏳ Memuat data...</div></div>

<!-- KIRIM EVENT -->
<div class="panel">
  <h2>📅 Kirim Event ke Google Calendar</h2>

  <!-- Judul -->
  <label>Judul Event *</label>
  <input type="text" id="evTitle" placeholder="⚽ Brasil VS Argentina — Tebak Skor!">

  <!-- Tanggal & Jam -->
  <div class="row">
    <div class="col">
      <label>Tanggal *</label>
      <input type="date" id="evDate">
    </div>
    <div class="col">
      <label>Jam Mulai *</label>
      <input type="time" id="evTimeStart">
    </div>
    <div class="col">
      <label>Jam Selesai *</label>
      <input type="time" id="evTimeEnd">
    </div>
  </div>

  <!-- Reminder -->
  <label>Reminder (menit sebelum event)</label>
  <input type="number" id="evReminder" value="30" min="1" max="1440" style="max-width:160px">

  <!-- Rich Text Deskripsi -->
  <label>Deskripsi</label>
  <div class="editor-toolbar">
    <button onclick="fmt('bold')" title="Bold"><b>B</b></button>
    <button onclick="fmt('italic')" title="Italic"><i>I</i></button>
    <button onclick="fmt('underline')" title="Underline"><u>U</u></button>
    <div class="sep"></div>
    <button onclick="insertLink()" title="Insert Link">🔗 Link</button>
    <div class="sep"></div>
    <button onclick="fmt('insertUnorderedList')" title="Bullet List">• List</button>
    <button onclick="fmt('insertOrderedList')" title="Numbered List">1. List</button>
    <div class="sep"></div>
    <button onclick="clearEditor()" title="Clear" style="color:#ef5350">✕ Clear</button>
  </div>
  <div class="editor-content" id="editorContent" contenteditable="true"
       placeholder="Tulis deskripsi event..."></div>

  <!-- Attachment -->
  <label>Attachment (Upload ke Drive)</label>
  <input type="file" id="attFile" onchange="handleFileSelect(event)" accept="*/*">
  <div class="attachment-list" id="attachmentList"></div>

  <!-- Kirim ke -->
  <label>Kirim ke</label>
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
    <label style="text-transform:none;color:#eee;display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="radio" name="sendMode" value="all" checked> Semua user (authorized)
    </label>
    <label style="text-transform:none;color:#eee;display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="radio" name="sendMode" value="one"> Email tertentu
    </label>
  </div>
  <div id="specificWrap" style="display:none;margin-bottom:14px">
    <label>Email target</label>
    <input type="text" id="specific" placeholder="email@gmail.com" style="margin-bottom:0">
  </div>

  <button class="btn" id="sendBtn" onclick="sendEvent()">📤 Kirim Event Sekarang</button>
  <div class="progress-bar" id="progressBar"><div class="progress-bar-inner" id="progressInner"></div></div>
  <div class="result" id="sendResult"></div>
</div>

<!-- LINK DIALOG -->
<div class="link-dialog" id="linkDialog">
  <div class="link-box">
    <h3>🔗 Insert Link</h3>
    <label>Teks yang ditampilkan</label>
    <input type="text" id="linkText" placeholder="Contoh: Klik di sini">
    <label>URL</label>
    <input type="text" id="linkUrl" placeholder="https://...">
    <div class="link-box-btns">
      <button class="btn btn-sm btn-ghost" onclick="closeLinkDialog()">Batal</button>
      <button class="btn btn-sm" onclick="confirmLink()">Insert</button>
    </div>
  </div>
</div>

<!-- USER LIST -->
<div class="panel">
  <h2>👥 Daftar User</h2>
  <div id="userTable"><div class="loading">⏳ Memuat...</div></div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1G85WVH53xRcoPsKNMlniRQXObUlvF47kegtaQlUptTnkclMngnWtRTApvVx4WwQ3/exec';

  // Set default date & time
  const now   = new Date();
  const pad   = n => String(n).padStart(2,'0');
  document.getElementById('evDate').value       = now.toISOString().slice(0,10);
  document.getElementById('evTimeStart').value  = pad(now.getHours()) + ':' + pad(now.getMinutes());
  const later = new Date(now.getTime() + 7200000);
  document.getElementById('evTimeEnd').value    = pad(later.getHours()) + ':' + pad(later.getMinutes());

  // Radio mode
  document.querySelectorAll('input[name=sendMode]').forEach(r => {
    r.addEventListener('change', () => {
      document.getElementById('specificWrap').style.display =
        document.querySelector('input[name=sendMode]:checked').value === 'one' ? 'block' : 'none';
    });
  });

  // ── RICH TEXT EDITOR ──
  function fmt(cmd, val) {
    document.getElementById('editorContent').focus();
    document.execCommand(cmd, false, val || null);
  }
  function clearEditor() { document.getElementById('editorContent').innerHTML = ''; }

  // Link dialog
  let savedSelection = null;
  function insertLink() {
    const sel = window.getSelection();
    if (sel.rangeCount) savedSelection = sel.getRangeAt(0).cloneRange();
    document.getElementById('linkText').value = sel.toString() || '';
    document.getElementById('linkUrl').value  = '';
    document.getElementById('linkDialog').classList.add('show');
    setTimeout(() => document.getElementById('linkUrl').focus(), 100);
  }
  function closeLinkDialog() { document.getElementById('linkDialog').classList.remove('show'); }
  function confirmLink() {
    const text = document.getElementById('linkText').value.trim();
    const url  = document.getElementById('linkUrl').value.trim();
    if (!url) { alert('URL wajib diisi'); return; }

    const editor = document.getElementById('editorContent');
    editor.focus();

    if (savedSelection) {
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedSelection);
    }

    const link = `<a href="${url}" target="_blank">${text || url}</a>`;
    document.execCommand('insertHTML', false, link);
    closeLinkDialog();
  }

  // ── ATTACHMENT ──
  let attachments = []; // { name, base64, mimeType }

  function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const base64 = ev.target.result.split(',')[1];
      attachments.push({ name: file.name, base64, mimeType: file.type || 'application/octet-stream' });
      renderAttachments();
    };
    reader.readAsDataURL(file);
    e.target.value = ''; // reset input
  }

  function renderAttachments() {
    const list = document.getElementById('attachmentList');
    if (!attachments.length) { list.innerHTML = ''; return; }
    list.innerHTML = attachments.map((a, i) => `
      <div class="attachment-item">
        <span>📎</span>
        <span class="att-name">${a.name}</span>
        <span class="att-status" id="att-status-${i}">Siap upload</span>
        <button class="att-remove" onclick="removeAttachment(${i})">✕</button>
      </div>
    `).join('');
  }

  function removeAttachment(i) {
    attachments.splice(i, 1);
    renderAttachments();
  }

  // ── LOAD USERS ──
  async function loadUsers() {
    try {
      const r = await fetch(APPS_SCRIPT_URL + '?action=getUsers');
      const d = await r.json();
      const users     = d.users || [];
      const totalAuth = users.filter(u => u.status === 'authorized').length;

      document.getElementById('statsBox').innerHTML = `
        <div class="stat"><div class="n">${users.length}</div><div class="l">Total User</div></div>
        <div class="stat"><div class="n">${totalAuth}</div><div class="l">Calendar Terhubung</div></div>
      `;

      if (!users.length) {
        document.getElementById('userTable').innerHTML = '<div class="loading">Belum ada user</div>';
        return;
      }
      document.getElementById('userTable').innerHTML = `
        <table>
          <thead><tr><th>#</th><th>Email</th><th>Nama</th><th>Status</th><th>Terdaftar</th></tr></thead>
          <tbody>
            ${users.map((u,i) => `
              <tr>
                <td>${i+1}</td>
                <td>${u.email}</td>
                <td>${u.nama || '-'}</td>
                <td><span class="badge ${u.status === 'authorized' ? 'ok' : 'no'}">${u.status}</span></td>
                <td>${u.timestamp || '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch(e) {
      document.getElementById('statsBox').innerHTML  = '<div class="loading" style="color:#ef5350">Gagal load</div>';
      document.getElementById('userTable').innerHTML = '<div class="loading" style="color:#ef5350">' + e.message + '</div>';
    }
  }

  // ── SEND EVENT ──
  async function sendEvent() {
    const title     = document.getElementById('evTitle').value.trim();
    const date      = document.getElementById('evDate').value;
    const timeStart = document.getElementById('evTimeStart').value;
    const timeEnd   = document.getElementById('evTimeEnd').value;
    const reminder  = parseInt(document.getElementById('evReminder').value) || 30;
    const desc      = document.getElementById('editorContent').innerHTML.trim();
    const mode      = document.querySelector('input[name=sendMode]:checked').value;
    const specific  = document.getElementById('specific').value.trim();

    if (!title || !date || !timeStart || !timeEnd) {
      showResult('err', '❌ Judul, tanggal, dan jam wajib diisi.');
      return;
    }
    if (mode === 'one' && !specific) {
      showResult('err', '❌ Masukkan email target.');
      return;
    }

    const start = date + 'T' + timeStart + ':00';
    const end   = date + 'T' + timeEnd   + ':00';

    const btn = document.getElementById('sendBtn');
    btn.disabled = true; btn.textContent = '⏳ Mengirim...';
    showProgress(30);

    try {
      // Upload attachments dulu ke Drive via Apps Script
      let driveFiles = [];
      if (attachments.length) {
        showProgress(50);
        for (let i = 0; i < attachments.length; i++) {
          document.getElementById('att-status-' + i).textContent = '⏳ Uploading...';
          const upRes  = await fetch(APPS_SCRIPT_URL + '?action=uploadDrive&' + new URLSearchParams({
            fileName: attachments[i].name,
            mimeType: attachments[i].mimeType,
            base64:   attachments[i].base64
          }));
          const upData = await upRes.json();
          if (upData.success) {
            driveFiles.push({ name: attachments[i].name, fileUrl: upData.fileUrl, mimeType: attachments[i].mimeType });
            document.getElementById('att-status-' + i).textContent = '✅ Uploaded';
          } else {
            document.getElementById('att-status-' + i).textContent = '❌ Gagal';
          }
        }
      }

      showProgress(70);

      const params = new URLSearchParams({
        action:      'sendEvent',
        title:       title,
        start:       start,
        end:         end,
        desc:        desc,
        reminder:    reminder,
        mode:        mode,
        specific:    specific,
        attachments: JSON.stringify(driveFiles)
      });
      const r = await fetch(APPS_SCRIPT_URL + '?' + params.toString());
      const d = await r.json();

      showProgress(100);

      if (d.success) {
        showResult('ok', `✅ Berhasil kirim ke ${d.sent} user! ${d.failed > 0 ? '(' + d.failed + ' gagal)' : ''}`);
      } else {
        showResult('err', '❌ Error: ' + (d.error || 'Unknown'));
      }
    } catch(e) {
      showResult('err', '❌ ' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = '📤 Kirim Event Sekarang';
      setTimeout(() => { document.getElementById('progressBar').style.display = 'none'; }, 1000);
    }
  }

  function showProgress(pct) {
    const bar = document.getElementById('progressBar');
    bar.style.display = 'block';
    document.getElementById('progressInner').style.width = pct + '%';
  }

  function showResult(type, msg) {
    const el = document.getElementById('sendResult');
    el.className = 'result ' + type;
    el.innerHTML = msg;
    el.style.display = 'block';
  }

  // Init
  loadUsers();
</script>
</body>
</html>
